<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCNJ NASA Human Lander Challenge</title>
<meta name="description" content="TCNJ's NASA Human Lander Challenge capstone project: the project, the team, and past alumni.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --bg: #f2efe6;
    --surface: #ffffff;
    --surface-2: #e9e3d3;
    --text: #1a2032;
    --text-muted: #5c6478;
    --accent: #c8590d;
    --accent-ink: #ffffff;
    --accent-2: #1f6e82;
    --border: #d9d2bd;
    --grid-line: rgba(26,32,50,0.06);
    --shadow: 0 20px 50px -25px rgba(26,32,50,0.35);
    --focus: #1f6e82;
    --horizon: #dcd5c2;
    --horizon-line: #b8ae94;
    --moon-display: none;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #090d18;
      --surface: #121a2e;
      --surface-2: #182444;
      --text: #edf0f8;
      --text-muted: #97a1ba;
      --accent: #f4832a;
      --accent-ink: #171008;
      --accent-2: #6fd7ea;
      --border: #29365a;
      --grid-line: rgba(255,255,255,0.05);
      --shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
      --focus: #6fd7ea;
      --horizon: #131c34;
      --horizon-line: #33456f;
      --moon-display: block;
    }
  }
  :root[data-theme="dark"]{
    --bg: #090d18;
    --surface: #121a2e;
    --surface-2: #182444;
    --text: #edf0f8;
    --text-muted: #97a1ba;
    --accent: #f4832a;
    --accent-ink: #171008;
    --accent-2: #6fd7ea;
    --border: #29365a;
    --grid-line: rgba(255,255,255,0.05);
    --shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
    --focus: #6fd7ea;
    --horizon: #131c34;
    --horizon-line: #33456f;
    --moon-display: block;
  }

  *{ box-sizing: border-box; }
  body{
    margin:0;
    color: var(--text);
    font-family: "Public Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  img{ max-width: 100%; }
  h1,h2,h3,.display{
    font-family: "Big Shoulders Display", "Arial Narrow", sans-serif;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    text-wrap: balance;
    margin: 0;
  }
  .mono{ font-family: "JetBrains Mono", ui-monospace, "Courier New", monospace; }
  a{ color: inherit; }
  button{ font-family: inherit; }

  /* ---------- backgrounds ---------- */
  .site-bg{
    position: fixed; inset: 0; z-index: -4;
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/48px 48px,
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/48px 48px,
      var(--bg);
  }
  .moon-bg{
    display: var(--moon-display);
    position: fixed; inset: 0; z-index: -3; overflow: hidden; pointer-events: none;
    background: var(--bg);
  }
  .moon-photo{
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, color-mix(in srgb, var(--bg) 28%, transparent) 0%, color-mix(in srgb, var(--bg) 50%, transparent) 55%, var(--bg) 92%),
      url('images/site/apollo17-station6.jpg') 80% 55% / cover no-repeat;
    filter: brightness(0.85) contrast(1.05);
  }
  header.topbar{
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
    padding: 14px clamp(16px, 4vw, 40px);
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-family:"JetBrains Mono", monospace; font-weight:700; font-size:12px;
    color: var(--accent);
    flex: none;
  }
  .brand-text{ line-height: 1.05; }
  .brand-text .line1{ font-size: 11px; letter-spacing:0.14em; color: var(--text-muted); font-family:"JetBrains Mono",monospace; }
  .brand-text .line2{ font-family:"Big Shoulders Display",sans-serif; font-weight:800; font-size: 18px; text-transform:uppercase; }

  nav.tabs{ display:flex; gap: 4px; flex-wrap: wrap; }
  nav.tabs button{
    appearance:none; border:1px solid transparent; background:transparent;
    color: var(--text-muted); padding: 8px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase;
    cursor:pointer; transition: all .15s ease;
  }
  nav.tabs button:hover{ color: var(--text); border-color: var(--border); }
  nav.tabs button[aria-selected="true"]{
    background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
  }
  nav.tabs button:focus-visible, .theme-toggle:focus-visible, .card a:focus-visible{
    outline: 2px solid var(--focus); outline-offset: 2px;
  }

  .theme-toggle{
    appearance:none; border:1px solid var(--border); background: var(--surface);
    color: var(--text); border-radius: 999px; padding: 8px 12px; font-size:12px;
    cursor:pointer; font-family:"JetBrains Mono",monospace;
  }

  @media (max-width: 640px){
    header.topbar{ flex-wrap: wrap; row-gap: 10px; }
    header.topbar .brand{ order:1; }
    header.topbar .theme-toggle{ order:2; }
    nav.tabs{ order:3; width:100%; justify-content:center; }
  }

  .year-switch{ display:flex; gap:4px; flex-wrap:wrap; margin: 2px 0 26px; }
  .year-switch button{
    appearance:none; background:transparent; color: var(--text-muted);
    padding: 7px 14px; border-radius: 999px; border:1px solid var(--border);
    font-size: 12px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase;
    cursor:pointer; transition: all .15s ease;
  }
  .year-switch button:hover{ color: var(--text); }
  .year-switch button[aria-selected="true"]{ background: var(--accent-2); border-color: var(--accent-2); color: var(--accent-ink); }
  .year-switch button:focus-visible{ outline: 2px solid var(--focus); outline-offset: 2px; }

  main{ max-width: 1100px; margin: 0 auto; padding: clamp(24px,5vw,56px) clamp(16px,4vw,40px) 140px; }
  section.page{ display:none; }
  section.page.active{ display:block; }
  @media (prefers-reduced-motion: reduce){ *{ scroll-behavior:auto !important; } }

  /* ---------- scroll reveal ---------- */
  .reveal{ opacity:0; transform: translateY(28px); transition: opacity .7s ease, transform .7s ease; }
  .reveal.in-view{ opacity:1; transform:none; }
  @media (prefers-reduced-motion: reduce){
    .reveal{ transition:none; opacity:1; transform:none; }
  }

  /* ---------- home ---------- */
  .hero{ padding: clamp(48px,10vw,120px) 0 clamp(56px,8vw,88px); }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:"JetBrains Mono",monospace; font-size:12px; letter-spacing:0.16em;
    color: var(--accent-2); text-transform:uppercase; margin-bottom: 18px;
  }
  .eyebrow::before{ content:"◆"; font-size:10px; }
  .hero h1{ font-size: clamp(2.8rem, 8vw, 5.6rem); line-height: 0.95; }
  .hero .accent-word{ color: var(--accent); }
  .hero p.lede{
    max-width: 62ch; font-size: 1.15rem; color: var(--text); margin-top: 22px; line-height:1.6;
  }
  .hero-actions{ display:flex; gap:12px; margin-top: 30px; flex-wrap: wrap; }
  .btn{
    display:inline-flex; align-items:center; gap:8px; padding: 12px 22px; border-radius: 8px;
    font-weight: 700; font-size: 14px; letter-spacing:0.02em; text-transform:uppercase;
    text-decoration:none; cursor:pointer; border: 1px solid transparent;
  }
  .btn-primary{ background: var(--accent); color: var(--accent-ink); }
  .btn-ghost{ background: var(--accent-2); border-color: var(--accent-2); color: var(--accent-ink); }

  .scroll-cue{
    margin-top: 64px; display:flex; align-items:center; gap:10px;
    color: var(--text-muted); font-family:"JetBrains Mono",monospace; font-size:11px;
    letter-spacing: 0.12em; text-transform:uppercase;
  }
  .scroll-cue .arrow{ animation: bob 1.8s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(5px);} }
  @media (prefers-reduced-motion: reduce){ .scroll-cue .arrow{ animation:none; } }

  .telemetry{
    margin-top: 20px; display:grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
    border: 1px solid var(--border); border-radius: 12px; overflow:hidden;
    background: color-mix(in srgb, var(--surface) 92%, transparent); box-shadow: var(--shadow);
    backdrop-filter: blur(6px);
  }
  .telemetry .cell{ padding: 20px 22px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .telemetry .cell:last-child{ border-right:none; }
  .telemetry .k{ font-family:"JetBrains Mono",monospace; font-size:10.5px; letter-spacing:0.12em; color:var(--text-muted); text-transform:uppercase; }
  .telemetry .v{ font-family:"JetBrains Mono",monospace; font-size:15px; font-weight:600; margin-top:6px; color: var(--text); }
  .telemetry .v.status{ color: var(--accent-2); }

  .section-head{ margin: 0 0 28px; display:flex; align-items:baseline; gap:16px; }
  .section-head .num{ font-family:"JetBrains Mono",monospace; color: var(--accent); font-size: 14px; }
  .section-head h2{ font-size: clamp(1.7rem, 4vw, 2.6rem); }
  .section-head .rule{ flex:1; height:1px; background: var(--border); }

  .stack{ display:flex; flex-direction:column; gap: 120px; }
  .stack-tight{ display:flex; flex-direction:column; gap: 28px; }

  .panel{
    border:1px solid var(--border); background: color-mix(in srgb, var(--surface) 94%, transparent); border-radius: 16px;
    padding: 32px clamp(24px,4vw,44px); box-shadow: var(--shadow); backdrop-filter: blur(6px);
  }
  .panel h3{ font-size: 1.4rem; margin-bottom: 14px; }
  .panel p{ color: var(--text-muted); line-height:1.7; font-size:1rem; max-width: 68ch; }
  .panel ul{ margin: 16px 0 0; padding-left: 20px; color: var(--text-muted); line-height:1.8; font-size:0.96rem; }
  .panel + .panel{ margin-top: 24px; }

  .spec-list{ list-style:none; margin: 24px 0 0; padding:0; display:grid; gap: 12px; max-width: 44ch; }
  .spec-list li{ display:flex; justify-content:space-between; gap: 16px; padding: 10px 0; border-bottom: 1px dashed var(--border); font-size: 0.92rem; }
  .spec-list .lbl{ color: var(--text-muted); }
  .spec-list .val{ font-family:"JetBrains Mono",monospace; text-align:right; }

  .phase-track{ display:grid; grid-template-columns: repeat(4,1fr); gap: 2px; background: var(--border); border-radius: 14px; overflow:hidden; border:1px solid var(--border); }
  @media (max-width: 700px){ .phase-track{ grid-template-columns: 1fr; } }
  .phase-track .phase{ background: var(--surface); padding: 22px; }
  .phase-track .phase.current{ box-shadow: inset 0 3px 0 0 var(--accent); }
  .phase-track .phase .tag{ font-family:"JetBrains Mono",monospace; font-size:11px; color: var(--accent-2); letter-spacing:0.1em; }
  .phase-track .phase .tag.current-tag{ color: var(--accent); }
  .phase-track .phase h4{ font-size: 1.05rem; margin: 8px 0 6px; font-family:"Big Shoulders Display",sans-serif; text-transform:uppercase; font-weight:700; }
  .phase-track .phase p{ font-size: 0.85rem; color: var(--text-muted); margin:0; line-height:1.5; }

  /* ---------- team & alumni cards ---------- */
  .card-grid{ display:grid; grid-template-columns: repeat(auto-fill,minmax(260px,1fr)); gap: 26px; }
  .card{
    border:1px solid var(--border); background: color-mix(in srgb, var(--surface) 94%, transparent); border-radius: 14px;
    box-shadow: var(--shadow); position:relative; backdrop-filter: blur(6px);
    padding:0; overflow:hidden; display:flex; flex-direction:column;
  }
  .card-media{
    width:100%; aspect-ratio: 4 / 5; overflow:hidden;
    background: var(--surface-2); border-bottom: 1px solid var(--border);
  }
  .card-media img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card-media-fallback{
    display:flex; align-items:center; justify-content:center;
    font-family:"Big Shoulders Display",sans-serif; font-weight:800; color: var(--accent);
    font-size: 64px;
  }
  .card-body{ padding: 20px 22px 24px; }
  .card h4{ font-size: 1.05rem; font-family:"Big Shoulders Display",sans-serif; text-transform:uppercase; font-weight:700; }
  .card .role{ font-size: 0.82rem; color: var(--accent-2); font-family:"JetBrains Mono",monospace; margin-top:2px; }
  .card p.bio{ font-size: 0.86rem; color: var(--text-muted); margin-top: 10px; line-height:1.55; }
  .card .meta{ margin-top: 12px; display:flex; gap:8px; flex-wrap:wrap; }
  .pill{ font-family:"JetBrains Mono",monospace; font-size: 10.5px; letter-spacing:0.06em; text-transform:uppercase; background: var(--surface-2); border:1px solid var(--border); border-radius: 999px; padding: 4px 9px; color: var(--text-muted); }

  footer{
    border-top: 1px solid var(--border); padding: 32px clamp(16px,4vw,40px) 40px;
    display:flex; flex-wrap:wrap; gap: 16px; align-items:center; justify-content:space-between;
    color: var(--text-muted); font-size: 0.85rem;
    background: color-mix(in srgb, var(--bg) 70%, transparent);
  }
  footer .foot-links{ display:flex; gap: 18px; }
  footer a{ text-decoration:none; color: var(--text-muted); }
  footer a:hover{ color: var(--accent); }
</style>
</head>
<body>

<div class="site-bg"></div>
<div class="moon-bg" aria-hidden="true">
  <div class="moon-photo"></div>
</div>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark" id="brandMark">HL</div>
    <div class="brand-text">
      <div class="line1" id="brandLine1">TCNJ · SCHOOL OF ENGINEERING</div>
      <div class="line2" id="brandLine2">HuLC Capstone</div>
    </div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Site sections">
    <button role="tab" aria-selected="true" data-target="home">Home</button>
    <button role="tab" aria-selected="false" data-target="project">The Project</button>
    <button role="tab" aria-selected="false" data-target="team">Team</button>
    <button role="tab" aria-selected="false" data-target="alumni">Alumni</button>
  </nav>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle color theme">◐ THEME</button>
</header>

<main>

  <!-- ============ HOME ============ -->
  <section class="page active" id="home">
    <div class="hero" id="heroContent"><!-- filled by JS --></div>
    <div class="stack" id="homeStack"><!-- filled by JS: telemetry + panels --></div>
  </section>

  <!-- ============ PROJECT ============ -->
  <section class="page" id="project">
    <div class="section-head"><span class="num mono">01</span><h2>The Project</h2><div class="rule"></div></div>
    <div class="stack" id="projectStack"><!-- filled by JS --></div>
  </section>

  <!-- ============ TEAM ============ -->
  <section class="page" id="team">
    <div class="section-head"><span class="num mono">02</span><h2>The Team</h2><div class="rule"></div></div>
    <nav class="year-switch" role="tablist" aria-label="Team year" id="teamYearTabs">
      <button role="tab" aria-selected="true" data-year="current">2026–2027 Team</button>
      <button role="tab" aria-selected="false" data-year="lastyear">2025–2026 Team</button>
    </nav>
    <div class="stack-tight reveal" id="teamStack"><!-- filled by JS --></div>
  </section>

  <!-- ============ ALUMNI ============ -->
  <section class="page" id="alumni">
    <div class="section-head"><span class="num mono">03</span><h2>Project Alumni</h2><div class="rule"></div></div>
    <div class="stack-tight reveal" id="alumniStack"><!-- filled by JS --></div>
  </section>

</main>

<footer id="siteFooter"><!-- filled by JS --></footer>

<script>
(function(){
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  fetch('content/site.json').then(function(r){ return r.json(); }).then(render).catch(function(err){
    console.error('Could not load content/site.json', err);
  });

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function render(data){
    document.title = data.meta.title;
    var descTag = document.querySelector('meta[name="description"]');
    if (descTag) descTag.setAttribute('content', data.meta.description);

    document.getElementById('brandMark').textContent = data.brand.mark;
    document.getElementById('brandLine1').textContent = data.brand.line1;
    document.getElementById('brandLine2').textContent = data.brand.line2;

    renderHome(data.home);
    renderProject(data.project);
    renderTeam(data.team);
    renderAlumni(data.alumni);
    renderFooter(data.footer);

    setupTabs();
    setupTheme();
    setupReveal();
  }

  function renderHome(h){
    document.getElementById('heroContent').innerHTML =
      '<div class="eyebrow">' + esc(h.eyebrow) + '</div>' +
      '<h1>' + esc(h.headline_line1) + '<br><span class="accent-word">' + esc(h.headline_accent) + '</span></h1>' +
      '<p class="lede">' + esc(h.lede) + '</p>' +
      '<div class="hero-actions">' +
        '<button class="btn btn-primary" data-target="project">View the project</button>' +
        '<button class="btn btn-ghost" data-target="team">Meet the team</button>' +
      '</div>' +
      '<div class="scroll-cue"><span class="arrow">↓</span> Scroll</div>';

    var cells = h.telemetry.map(function(t){
      return '<div class="cell"><div class="k">' + esc(t.k) + '</div><div class="v' + (t.status ? ' status' : '') + '">' + esc(t.v) + '</div></div>';
    }).join('');

    document.getElementById('homeStack').innerHTML =
      '<div class="telemetry mono reveal">' + cells + '</div>' +
      '<div class="panel reveal"><h3>' + esc(h.panel_hulc_title) + '</h3><p>' + esc(h.panel_hulc_body) + '</p></div>';
  }

  function renderProject(p){
    var specs = p.spec_list.map(function(s){
      return '<li><span class="lbl">' + esc(s.lbl) + '</span><span class="val">' + esc(s.val) + '</span></li>';
    }).join('');

    var phases = p.phases.map(function(ph){
      return '<div class="phase' + (ph.current ? ' current' : '') + '">' +
        '<div class="tag' + (ph.current ? ' current-tag' : '') + '">' + esc(ph.tag) + (ph.current ? ' · CURRENT' : '') + '</div>' +
        '<h4>' + esc(ph.title) + '</h4><p>' + esc(ph.body) + '</p></div>';
    }).join('');

    document.getElementById('projectStack').innerHTML =
      '<div class="panel reveal"><h3>' + esc(p.artemis_title) + '</h3><p>' + esc(p.artemis_body) + '</p></div>' +
      '<div class="panel reveal"><h3>' + esc(p.angle_title) + '</h3>' +
        '<p>' + esc(p.angle_body_1) + '</p>' +
        '<p>' + esc(p.angle_body_2) + '</p>' +
        '<ul class="spec-list">' + specs + '</ul>' +
      '</div>' +
      '<div class="phase-track reveal">' + phases + '</div>';
  }

  function memberCard(m, extraPill){
    var media = '';
    if (!m.no_photo) {
      media = m.photo
        ? '<div class="card-media"><img src="' + esc(m.photo) + '" alt="' + esc(m.name) + '" loading="lazy"></div>'
        : '<div class="card-media card-media-fallback">' + esc(m.initials || '') + '</div>';
    }
    return '<div class="card">' +
      media +
      '<div class="card-body">' +
      '<h4>' + esc(m.name) + '</h4>' +
      '<div class="role">' + esc(m.year) + '</div>' +
      '<p class="bio">' + esc(m.bio) + '</p>' +
      (extraPill ? '<div class="meta"><span class="pill">' + esc(extraPill) + '</span></div>' : '') +
      '</div>' +
      '</div>';
  }

  var teamData = null;
  function renderTeam(t){
    teamData = t;
    renderTeamYear('current');
    var yearBtns = document.querySelectorAll('#teamYearTabs button');
    yearBtns.forEach(function(btn){
      btn.addEventListener('click', function(){
        yearBtns.forEach(function(b){ b.setAttribute('aria-selected', b === btn ? 'true' : 'false'); });
        renderTeamYear(btn.dataset.year);
      });
    });
  }

  function renderTeamYear(yr){
    var isLast = yr === 'lastyear';
    var note = isLast ? (teamData.lastyear_note || '') : teamData.note;
    var members = isLast ? (teamData.lastyear_members || []) : teamData.members;
    var cards = members.map(function(m){ return memberCard(m); }).join('');
    document.getElementById('teamStack').innerHTML =
      '<p style="max-width:62ch;color:var(--text-muted);">' + esc(note) + '</p>' +
      '<div class="card-grid">' + cards + '</div>';
  }

  function renderAlumni(a){
    var cards = a.members.map(function(m){ return memberCard(m, m.now ? ('Now at ' + m.now) : null); }).join('');
    document.getElementById('alumniStack').innerHTML =
      '<p style="max-width:62ch;color:var(--text-muted);">' + esc(a.intro) + '</p>' +
      '<div class="card-grid">' + cards + '</div>';
  }

  function renderFooter(f){
    var links = f.links.map(function(l){
      var external = /^https?:\/\//.test(l.href);
      return '<a href="' + esc(l.href) + '"' + (external ? ' target="_blank" rel="noopener"' : '') + '>' + esc(l.label) + '</a>';
    }).join('');
    document.getElementById('siteFooter').innerHTML =
      '<div>© <span id="year"></span> ' + esc(f.org) + '</div>' +
      '<div class="foot-links">' + links + '</div>';
    document.getElementById('year').textContent = new Date().getFullYear();
  }

  // ---- tab navigation ----
  function setupTabs(){
    var tabs = document.querySelectorAll('nav.tabs button');
    var pages = document.querySelectorAll('section.page');
    var actionButtons = document.querySelectorAll('.btn[data-target]');

    function show(target){
      pages.forEach(function(p){ p.classList.toggle('active', p.id === target); });
      tabs.forEach(function(t){ t.setAttribute('aria-selected', t.dataset.target === target ? 'true' : 'false'); });
      window.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'instant' in window ? 'instant' : 'auto' });
      revealVisible();
    }
    tabs.forEach(function(t){ t.addEventListener('click', function(){ show(t.dataset.target); }); });
    actionButtons.forEach(function(b){ b.addEventListener('click', function(){ show(b.dataset.target); }); });
  }

  // ---- theme toggle ----
  function setupTheme(){
    // Default to the dark/space theme regardless of the visitor's system preference,
    // since the background photo and accent palette are designed for it — it only
    // switches to light if the visitor explicitly toggles it (remembered via localStorage).
    var root = document.documentElement;
    var toggle = document.getElementById('themeToggle');
    var saved = null;
    try{ saved = localStorage.getItem('hulc-theme'); }catch(e){}
    root.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
    toggle.addEventListener('click', function(){
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try{ localStorage.setItem('hulc-theme', next); }catch(e){}
    });
  }

  // ---- scroll reveal ----
  var observer;
  function setupReveal(){
    var targets = document.querySelectorAll('.reveal');
    if (reduced || !('IntersectionObserver' in window)){
      targets.forEach(function(el){ el.classList.add('in-view'); });
      return;
    }
    targets.forEach(function(el, i){ el.style.transitionDelay = Math.min(i * 60, 240) + 'ms'; });
    observer = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting){ entry.target.classList.add('in-view'); observer.unobserve(entry.target); }
      });
    }, { threshold: 0.12 });
    targets.forEach(function(el){ observer.observe(el); });
  }
  function revealVisible(){
    if (!observer) return;
    document.querySelectorAll('section.page.active .reveal:not(.in-view)').forEach(function(el){ observer.observe(el); });
  }

})();
</script>
